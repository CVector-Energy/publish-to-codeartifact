name: Publish to CodeArtifact
description: Build and publish a Python package to AWS CodeArtifact using uv

inputs:
  package-name:
    description: The Python package name (used in job summary output)
    required: true
  iam-role:
    description: ARN of the AWS IAM role to assume via OIDC
    required: true
  aws-region:
    description: AWS region
    required: false
    default: "us-east-1"
  codeartifact-domain:
    description: CodeArtifact domain name
    required: true
  codeartifact-domain-owner:
    description: CodeArtifact domain owner AWS account ID
    required: true
  codeartifact-repository:
    description: CodeArtifact repository name
    required: true
  uv-index-name:
    description: "Name of the uv index (from [[tool.uv.index]]) to authenticate for reading private dependencies during build. If set, UV_INDEX_{NAME}_USERNAME and UV_INDEX_{NAME}_PASSWORD are configured."
    required: false
    default: ""

outputs:
  package-version:
    description: Version of the package that was published, read from the built wheel
    value: ${{ steps.summary.outputs.package-version }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false # nothing here pushes; the token would only sit in the git config for later steps to read

    - name: Compute dev version
      if: github.event_name == 'push'
      shell: bash
      run: |
        DESCRIPTION=$(git describe --tags --long --match 'v*' 2>/dev/null || echo "v0.0.0-0-g$(git rev-parse --short HEAD)")
        LATEST_TAG=$(echo "$DESCRIPTION" | sed -E 's/-[0-9]+-g[0-9a-f]+$//')
        DISTANCE=$(echo "$DESCRIPTION" | sed -E 's/.*-([0-9]+)-g[0-9a-f]+$/\1/')
        NODE=$(echo "$DESCRIPTION" | sed -E 's/.*-[0-9]+-(g[0-9a-f]+)$/\1/')
        BASE_VERSION=${LATEST_TAG#v}
        IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
        DEV_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1)).dev${DISTANCE}+${NODE}.d$(date +%Y%m%d)"
        sed -i "s/^version = .*/version = \"$DEV_VERSION\"/" pyproject.toml

    - name: Compute rc version
      if: github.event_name == 'release' && github.event.release.prerelease
      shell: bash
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        BASE_VERSION="${RELEASE_TAG#v}"
        RC_VERSION="${BASE_VERSION}rc${GITHUB_RUN_NUMBER}"
        sed -i "s/^version = .*/version = \"$RC_VERSION\"/" pyproject.toml

    - name: Compute release version
      if: github.event_name == 'release' && !github.event.release.prerelease
      shell: bash
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        RELEASE_VERSION="${RELEASE_TAG#v}"
        sed -i "s/^version = .*/version = \"$RELEASE_VERSION\"/" pyproject.toml

    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: ${{ inputs.iam-role }}
        aws-region: ${{ inputs.aws-region }}

    - name: Configure CodeArtifact
      shell: bash
      env:
        DOMAIN: ${{ inputs.codeartifact-domain }}
        DOMAIN_OWNER: ${{ inputs.codeartifact-domain-owner }}
        REPOSITORY: ${{ inputs.codeartifact-repository }}
        REGION: ${{ inputs.aws-region }}
        INDEX_NAME: ${{ inputs.uv-index-name }}
      run: |
        CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain "$DOMAIN" --domain-owner "$DOMAIN_OWNER" --region "$REGION" --query authorizationToken --output text)
        CODEARTIFACT_URL=$(aws codeartifact get-repository-endpoint --domain "$DOMAIN" --domain-owner "$DOMAIN_OWNER" --repository "$REPOSITORY" --region "$REGION" --format pypi --query repositoryEndpoint --output text)
        echo "::add-mask::$CODEARTIFACT_AUTH_TOKEN"
        # uv reads these from the environment in the build and publish steps below, and the
        # uv-index variable names are built from an input, so an environment file is the only
        # way to set them. The values come from the CodeArtifact API, never from workflow
        # context, and a token is a single line, so it cannot forge further assignments.
        # zizmor: ignore[github-env]
        {
          echo "UV_PUBLISH_URL=${CODEARTIFACT_URL}"
          echo "UV_PUBLISH_USERNAME=aws"
          echo "UV_PUBLISH_PASSWORD=${CODEARTIFACT_AUTH_TOKEN}"
          if [[ -n "$INDEX_NAME" ]]; then
            ENV_NAME=$(echo "$INDEX_NAME" | tr '[:lower:]-' '[:upper:]_')
            echo "UV_INDEX_${ENV_NAME}_USERNAME=aws"
            echo "UV_INDEX_${ENV_NAME}_PASSWORD=${CODEARTIFACT_AUTH_TOKEN}"
          fi
        } >> "$GITHUB_ENV"

    - name: Build
      shell: bash
      run: uv build

    - name: Publish
      shell: bash
      run: uv publish

    - name: Job summary
      id: summary
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package-name }}
      run: |
        WHEEL_FILE=$(ls dist/*.whl 2>/dev/null | head -n 1)
        if [ -z "$WHEEL_FILE" ]; then
          echo "Error: No wheel file found in dist/"
          exit 1
        fi
        PACKAGE_VERSION=$(basename "$WHEEL_FILE" | cut -d- -f2)
        echo "package-version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
        {
          echo "## Published \`${PACKAGE_NAME}==${PACKAGE_VERSION}\`"
          echo ""
          echo "Install this build for testing:"
          echo '```'
          echo "cuv pip install ${PACKAGE_NAME}==${PACKAGE_VERSION}"
          echo '```'
          echo ""
          echo "Or pin in \`pyproject.toml\`:"
          echo '```toml'
          echo "dependencies = [\"${PACKAGE_NAME}==${PACKAGE_VERSION}\"]"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

branding:
  icon: package
  color: orange
